<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Quiz Game</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main id="app-root">
      <div id="start-screen" class="screen active" aria-hidden="false">
        <div class="container py-5">
          <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 text-center">
              <div class="trophy-icon mb-3">
                <img src="img/icons8-trophy-48.png" alt="Trofeo" width="64" />
              </div>

              <h1 class="display-title" id="start-title" tabindex="-1">Interactive Quiz</h1>
              <p class="subtitle mb-4">Pon a prueba tus conocimientos de desarrollo web</p>

              <p class="section-label">Elige una categoria</p>
              <div class="row mb-4" id="cat-grid">
                <div class="col-6 col-md-3 mb-2">
                  <button class="cat-btn w-100 selected" data-cat="javascript" type="button">
                    <img src="img/js.png" alt="JavaScript" width="32" class="cat-img" />
                    <br />
                    JavaScript
                  </button>
                </div>

                <div class="col-6 col-md-3 mb-2">
                  <button class="cat-btn w-100" data-cat="html" type="button">
                    <img src="img/html-5.png" alt="HTML" width="32" class="cat-img" />
                    <br />
                    HTML
                  </button>
                </div>

                <div class="col-6 col-md-3 mb-2">
                  <button class="cat-btn w-100" data-cat="css" type="button">
                    <span class="cat-icon">&#127912;</span>
                    <br />
                    CSS
                  </button>
                </div>

                <div class="col-6 col-md-3 mb-2">
                  <button class="cat-btn w-100" data-cat="general" type="button">
                    <img src="img/www.png" alt="Cultura Tech" width="32" class="cat-img" />
                    <br />
                    Cultura Tech
                  </button>
                </div>
              </div>

              <p class="section-label">Dificultad</p>
              <div class="btn-group mb-4 w-100" id="diff-group" role="group">
                <button class="diff-btn selected" data-diff="easy" type="button">Facil</button>
                <button class="diff-btn" data-diff="medium" type="button">Medio</button>
                <button class="diff-btn" data-diff="hard" type="button">Dificil</button>
              </div>

              <button class="btn-start w-100" id="start-btn" type="button">Comenzar Quiz</button>
            </div>
          </div>
        </div>
      </div>

      <div id="quiz-screen" class="screen" aria-hidden="true">
        <div class="container py-4">
          <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
              <div class="d-flex align-items-center justify-content-between mb-3">
                <span class="q-counter" id="q-counter" aria-live="polite">1 / 5</span>

                <div class="progress flex-grow-1 mx-3">
                  <div
                    class="progress-bar"
                    id="prog-bar"
                    role="progressbar"
                    style="width: 20%"
                    aria-valuenow="20"
                    aria-valuemin="0"
                    aria-valuemax="100"
                  ></div>
                </div>

                <span class="timer-badge" id="timer-badge" aria-live="polite">15s</span>
              </div>

              <div class="d-flex justify-content-between mb-2">
                <span class="q-meta" id="q-cat-tag" aria-live="polite">JavaScript - Facil</span>
                <span class="q-meta" id="score-live" aria-live="polite">Puntos: 0</span>
              </div>

              <div class="question-card mb-4">
                <p class="question-text mb-0" id="q-text" tabindex="-1">Cargando pregunta...</p>
              </div>

              <div id="options-grid" class="mb-4" role="group" aria-labelledby="q-text"></div>

              <div class="d-flex align-items-center justify-content-between">
                <span class="feedback-msg" id="feedback-msg" aria-live="polite" aria-atomic="true"></span>
                <button class="btn-next d-none" id="next-btn" type="button">Siguiente</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="result-screen" class="screen" aria-hidden="true">
        <div class="container py-5">
          <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 text-center">
              <div class="result-emoji mb-2" id="res-emoji">&#127881;</div>
              <h2 class="result-title" id="res-title" tabindex="-1">Excelente!</h2>
              <div class="score-big" id="res-score">80%</div>
              <p class="score-sub mb-4" id="res-sub">8 de 10 correctas</p>

              <div class="row mb-4">
                <div class="col-4">
                  <div class="stat-card">
                    <div class="stat-val text-success" id="st-correct">0</div>
                    <div class="stat-label">Correctas</div>
                  </div>
                </div>

                <div class="col-4">
                  <div class="stat-card">
                    <div class="stat-val text-danger" id="st-wrong">0</div>
                    <div class="stat-label">Incorrectas</div>
                  </div>
                </div>

                <div class="col-4">
                  <div class="stat-card">
                    <div class="stat-val" id="st-time">0s</div>
                    <div class="stat-label">Tiempo prom.</div>
                  </div>
                </div>
              </div>

              <div class="d-flex">
                <button class="btn-start flex-grow-1 mr-2" id="retry-btn" type="button">
                  Repetir Quiz
                </button>
                <button class="btn-secondary-action flex-grow-1" id="new-btn" type="button">
                  Nueva Categoria
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script
      src="https://code.jquery.com/jquery-3.7.1.js"
      integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
      crossorigin="anonymous"
    ></script>
    <script src="js/script.js" type="text/javascript"></script>
  </body>
</html>
